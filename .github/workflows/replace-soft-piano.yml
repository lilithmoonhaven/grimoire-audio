name: Replace soft-piano.mp3
on:
  push:
    paths:
      - .github/workflows/replace-soft-piano.yml
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace soft-piano.mp3 with newest track
        run: |
          cp new-cleaned/soft-piano-NEWEST.mp3 new-cleaned/soft-piano.mp3
          rm new-cleaned/soft-piano-NEWEST.mp3
          rm .github/workflows/replace-soft-piano.yml
          git config user.name "lilithmoonhaven"
          git config user.email "lilithmoonhaven@users.noreply.github.com"
          git add -A
          git commit -m "Replace soft-piano.mp3 with newest Raven Soft Piano song (less-echo version)"
          git push
